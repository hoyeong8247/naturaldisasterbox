
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | NaturalDisasterBox</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-page">

  <header class="site-header">
    <a class="brand" href="index.html">NaturalDisasterBox</a>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">

      <div class="auth-heading">
        <h1>Create Account</h1>
        <p>Join the NaturalDisasterBox community</p>
      </div>

      <form class="auth-form" id="signupForm">

        <div>
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div>
          <label for="signupEmail">Email Address</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
          >
        </div>

        <div>
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="8"
            required
          >
        </div>

        <div>
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="8"
            required
          >
        </div>

        <button type="submit" class="auth-submit">
          Create Account
        </button>

      </form>

      <div class="auth-switch">
        <p>Already have an account?</p>
        <a href="login.html">Log In</a>
      </div>

      <div class="auth-message" id="signupMessage"></div>

      <p class="auth-note">
        Demo interface only. No account is created and no information
        is transmitted or stored.
      </p>

    </section>
  </main>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("signupPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("signupMessage");

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match. Please try again.";
        message.style.display = "block";
        return;
      }

      message.textContent = "Demo only. Account registration is not connected yet.";
      message.style.display = "block";
    });
  </script>

</body>
</html>
